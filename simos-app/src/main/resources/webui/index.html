<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · Simos Shell</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="view" class="workbench-page">
  <header class="topbar">
    <h1>Simos 工作台</h1>
    <span id="shell-state" class="shell-state">状态加载中…</span>
  </header>

  <nav id="mode-bar" class="mode-bar" aria-label="模式栏">
    <button type="button" class="mode active" data-mode="view" aria-pressed="true">常规查看</button>
    <button type="button" class="mode" data-mode="region" aria-pressed="false">区域查看</button>
    <button type="button" class="mode" data-mode="map-edit" data-milestone="M8" disabled>地图编辑<span class="mode-badge">归 M8</span></button>
    <button type="button" class="mode" data-mode="region-edit" data-milestone="M8" disabled>区域编辑<span class="mode-badge">归 M8</span></button>
    <button type="button" class="mode" data-mode="unit" aria-pressed="false">单位移动与编辑</button>
  </nav>

  <main class="workbench">
    <section class="panel col-left" id="left-panel">
      <h2>详情</h2>
      <p id="left-status" class="muted">点选地图或单位以查看详情。</p>
      <dl class="kv" id="selection-detail"></dl>
      <h3>编制</h3>
      <div id="unit-tree-mount" class="unit-tree"></div>

      <section class="unit-editor" data-modes="unit" aria-label="单位移动与编辑">
        <h3>单位移动与编辑</h3>
        <p id="unit-edit-status" class="status muted">点选一个单位开始；右键点目标格自动下路线，右键点空白取消选中；左键点单位自身（或再点一次已选中的单位/其所在格）取消移动。</p>
        <p id="unit-edit-selected" class="muted">未选中单位</p>
        <div class="unit-edit-row">
          <button type="button" id="unit-route-toggle">路线模式：关</button>
          <button type="button" id="unit-route-send" disabled>下路线</button>
          <button type="button" id="unit-route-clear" disabled>清除路线</button>
        </div>
        <p id="unit-route-preview" class="muted">路线：（未选）</p>

        <fieldset class="unit-edit-group">
          <legend>改上级（ReparentUnit）</legend>
          <input id="unit-reparent-parent" type="text" placeholder="父单位 id（留空=清根）">
          <button type="button" id="unit-reparent" disabled>提交</button>
        </fieldset>

        <fieldset class="unit-edit-group">
          <legend>改编制（SetStrength）</legend>
          <input id="unit-strength-member" type="number" min="0" placeholder="人数">
          <input id="unit-strength-equipment" type="text" placeholder="步枪=50；火炮=2（留空=清空）">
          <button type="button" id="unit-strength" disabled>提交</button>
        </fieldset>

        <fieldset class="unit-edit-group">
          <legend>解散（DisbandUnit）</legend>
          <button type="button" id="unit-disband" disabled>解散选中单位</button>
        </fieldset>

        <fieldset class="unit-edit-group">
          <legend>新建单位（CreateUnit）</legend>
          <input id="unit-create-id" type="text" placeholder="id">
          <input id="unit-create-name" type="text" placeholder="名称">
          <input id="unit-create-q" type="number" placeholder="q">
          <input id="unit-create-r" type="number" placeholder="r">
          <input id="unit-create-member" type="number" min="0" placeholder="人数">
          <input id="unit-create-equipment" type="text" placeholder="步枪=50；火炮=2">
          <input id="unit-create-speed" type="number" min="1" placeholder="速度（≥1）">
          <input id="unit-create-mobility" type="number" min="1" placeholder="机动‰（≥1）">
          <input id="unit-create-parent" type="text" placeholder="上级 id（可空）">
          <button type="button" id="unit-create">创建</button>
        </fieldset>
      </section>
    </section>

    <section class="panel col-center" id="center-panel">
      <h2>地图 <span id="zoom-level" class="muted">缩放 1.00×</span></h2>
      <div id="canvas-mount" class="canvas-mount"></div>
      <p id="map-status" class="status muted">地图骨架。</p>
      <p id="legend" class="muted"></p>
    </section>

    <section class="panel col-right" id="right-panel">
      <div data-modes="region">
        <h2>区域</h2>
        <div id="region-panel-mount"></div>
      </div>
      <h3>待批</h3>
      <p id="approvals-count" class="status muted">审批未接入（T6）</p>
    </section>
  </main>

  <footer class="timeline-bar" id="timeline-bar">
    <div id="timeline-mount" class="timeline-track"></div>
    <div class="timeline-actions">
      <button type="button" id="timeline-create" class="primary" disabled
        title="推进时间一格（core.AdvanceTime）：单位沿已下路线出发/前进">创建节点（推进时间）</button>
      <button type="button" id="timeline-fork" disabled>分岔</button>
    </div>
    <span id="timeline-meta" class="muted">分支 — · rev —</span>
    <span id="timeline-status" class="tl-status muted"></span>
  </footer>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script src="unitTree.js"></script>
  <script src="timeline.js"></script>
  <script src="map.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.SimosApp.boot({ title: "工作台", approvals: "approvals-count" });
    });
  </script>
</body>
</html>
